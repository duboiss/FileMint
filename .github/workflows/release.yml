name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Disable Windows Defender real-time scanning
        if: matrix.platform == 'Windows'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction SilentlyContinue

      - name: Build Windows COM Shell Extension DLL
        if: matrix.platform == 'Windows'
        run: |
          cargo build --manifest-path src-tauri/crates/filemint-shell-ext/Cargo.toml --release
          Copy-Item src-tauri/target/release/filemint_shell_ext.dll src-tauri/sparse_package/filemint_lib.dll -Force

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FileMint ${{ github.ref_name }}'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish Draft Release with Commits Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Retrieve existing draft release notes
          CURRENT_BODY=$(gh release view "${{ github.ref_name }}" --json body -q .body 2>/dev/null || echo "")

          # 2. Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)

          # 3. Format list of included commits with markdown links
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LIST=$(git log "${PREV_TAG}..${{ github.ref_name }}" --no-merges --pretty=format:"* [%s](https://github.com/${{ github.repository }}/commit/%H)")
          else
            COMMIT_LIST=$(git log "${{ github.ref_name }}" --no-merges --pretty=format:"* [%s](https://github.com/${{ github.repository }}/commit/%H)")
          fi

          # 4. Construct release notes safely
          {
            if [ -n "$CURRENT_BODY" ]; then
              echo "$CURRENT_BODY"
              echo ""
            fi

            if [ -n "$PREV_TAG" ] && [[ "$CURRENT_BODY" != *"Full Changelog"* ]]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
              echo ""
            fi

            if [ -n "$COMMIT_LIST" ] && [[ "$CURRENT_BODY" != *"### Commits"* ]]; then
              echo "### Commits"
              echo "$COMMIT_LIST"
            fi
          } > release_notes.md

          for i in 1 2 3 4 5; do
            echo "Attempt $i: publishing release ${{ github.ref_name }} with commits changelog..."
            if gh release edit "${{ github.ref_name }}" --notes-file release_notes.md --draft=false; then
              echo "Release published successfully!"
              exit 0
            fi
            echo "Attempt $i failed (transient GitHub API error). Retrying in 10s..."
            sleep 10
          done
          echo "Failed to publish release after 5 attempts."
          exit 1
