name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies & Build frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Disable Windows Defender real-time scanning
        if: matrix.platform == 'Windows'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction SilentlyContinue

      - name: Build Windows COM Shell Extension DLL
        if: matrix.platform == 'Windows'
        run: |
          cargo build --manifest-path src-tauri/crates/filemint-shell-ext/Cargo.toml --release
          Copy-Item src-tauri/target/release/filemint_shell_ext.dll src-tauri/sparse_package/filemint_lib.dll -Force

      - name: Build Tauri Application & Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'FileMint ${{ github.ref_name }}'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i: publishing release ${{ github.ref_name }}..."
            if gh release edit "${{ github.ref_name }}" --draft=false; then
              echo "Release published successfully!"
              exit 0
            fi
            echo "Attempt $i failed (transient GitHub API error). Retrying in 10s..."
            sleep 10
          done
          echo "Failed to publish release after 5 attempts."
          exit 1
