[package]
name = "filemint-shell-ext"
version = "1.7.53"
edition = "2021"
authors = ["FileMint Team"]
license = "MIT"
description = "Windows 11 Explorer Command COM Shell Extension for FileMint"

[lib]
name = "filemint_shell_ext"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
winreg = "0.52"
serde_json = "1.0"
